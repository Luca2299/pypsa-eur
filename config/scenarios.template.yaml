# This file is used to define the scenarios that are run by snakemake. Each entry on the first level is a scenario. Each scenario can contain configuration overrides with respect to the config/config.yaml settings.
#
# Example
#
# custom-scenario: # name of the scenario
#   electricity:
#       renewable_carriers: [wind, solar] # override the list of renewable carriers

normal:
  electricity:
    renewable_carriers:
    - solar
    - onwind
    - offwind-ac
    - offwind-dc
    - hydro

no-offwind:
  electricity:
    renewable_carriers:
    - solar
    - onwind
    - hydro

# scenarios for different seasons 
winter: 
  snapshots:
    start: "2025-01-14"
    end: "2026-01-15"

spring:
  snapshots:
    start: "2025-04-14"
    end: "2025-04-15"

summer:
  snapshots:
    start: "2025-07-14"
    end: "2025-07-15"

fall:
  snapshots:
    start: "2025-09-14"
    end: "2025-09-15"
